<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Entreno de Ignacio</title>
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports": {"three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js"}}</script>
<style>
/* Mismo diseño que la app de Dante (pedido de Ignacio, 2026-10-13): encabezado verde, tarjetas, Barlow Condensed para títulos */
:root{
  --bg:#f3f4f0;--card:#ffffff;--card2:#f7f8f4;--ink:#12151a;--mut:#687079;--line:#e4e6e0;
  --acc:#0d7a54;--acc-ink:#ffffff;--acc2:#e2f3ea;--hero1:#0d7a54;--hero2:#0b3b2e;--hero-ink:#ffffff;
  --warn:#b23d1c;--warnbg:#fdebe4;--solo:#b7791f;--solo-ink:#ffffff;--solo2:#fbf1dc;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 8px 24px rgba(16,24,20,.06);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d10;--card:#14171c;--card2:#1a1e24;--ink:#eef0ec;--mut:#98a0a9;--line:#242a31;
  --acc:#3ddc97;--acc-ink:#05231a;--acc2:#13291f;--hero1:#12402f;--hero2:#0b0d10;--hero-ink:#ffffff;
  --warn:#ff9f7c;--warnbg:#361b12;--solo:#f2c14e;--solo-ink:#2a1e04;--solo2:#2f2610;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark
}}
:root[data-theme="dark"]{
  --bg:#0b0d10;--card:#14171c;--card2:#1a1e24;--ink:#eef0ec;--mut:#98a0a9;--line:#242a31;
  --acc:#3ddc97;--acc-ink:#05231a;--acc2:#13291f;--hero1:#12402f;--hero2:#0b0d10;--hero-ink:#ffffff;
  --warn:#ff9f7c;--warnbg:#361b12;--solo:#f2c14e;--solo-ink:#2a1e04;--solo2:#2f2610;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-block:0 92px}
h1,h2{font-family:Manrope,sans-serif;letter-spacing:.01em;text-wrap:balance}

.hero{background:linear-gradient(150deg,var(--hero1) 0%,var(--hero2) 100%);color:var(--hero-ink);padding:calc(22px + env(safe-area-inset-top,0px)) 20px 24px;border-radius:0 0 28px 28px;margin-bottom:6px}
.hero-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:16px}
.hero h1{font-size:40px;line-height:1;margin:0;font-weight:700;text-transform:uppercase}
.hero .sub{color:rgba(255,255,255,.78);font-size:14px;margin-top:4px}
.hpill{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.18)}
.anillo{margin-left:auto;flex:none;position:relative;width:76px;height:76px}
.anillo svg{transform:rotate(-90deg)}
.anillo b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 24px Manrope,sans-serif}
.anillo span{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap}
.kpis{max-width:620px;margin:22px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 6px;text-align:center}
.kpis b{display:block;font:700 24px/1 Manrope,sans-serif;font-variant-numeric:tabular-nums}
.kpis span{font-size:11px;color:rgba(255,255,255,.75)}

main{padding-inline:16px;max-width:620px;margin:0 auto}
.fijo-sueno{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.fijo-sueno span{color:var(--mut);font-size:12.5px;white-space:nowrap}.fijo-sueno .gym-n{color:var(--acc);font-size:inherit;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{font-size:24px;font-weight:700;margin:0 0 2px;text-transform:uppercase;line-height:1.1}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.sub{color:var(--mut);font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--card2);border:1px solid var(--line);margin:4px 4px 0 0}
.chip.peso{background:var(--acc2);color:var(--acc);border-color:transparent}

.b-gym{background:var(--acc);color:var(--acc-ink)}
.b-suave{background:var(--solo);color:var(--solo-ink)}
.b-libre{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.semana7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.semana7 button{position:relative;margin:0;width:auto;border-radius:12px;padding:8px 0 7px;text-align:center;font-size:11px;font-weight:600;line-height:1.25;min-width:0}
.semana7 b{display:block;font:700 19px/1.1 Manrope,sans-serif}
.semana7 .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.semana7 .sel{outline:2px solid var(--ink);outline-offset:1px}
.semana7 .hecho::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:currentColor}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--mut)}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}

.ej{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;border-top:1px solid var(--line);padding:14px 0}
.ej:first-child{border-top:0}
.num{grid-row:span 4;width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 17px Manrope,sans-serif;color:var(--mut)}
.ej.hecho .num{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ej .n{font-weight:600;font-size:15.5px;line-height:1.3}
.clave{font-size:13px;color:var(--mut);margin-top:3px}
.antes{font-size:12.5px;color:var(--acc);font-weight:600;margin-top:3px}
.tier{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:6px;font:700 11.5px Manrope,sans-serif;margin-right:7px;vertical-align:1px;border:1px solid var(--line);color:var(--mut)}
.tier.t-S{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.porque{font-size:13px;color:var(--ink);opacity:.85;margin-top:4px;line-height:1.4}
.videos{gap:8px;flex-wrap:wrap;margin-top:8px}
.videos a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-height:36px}
.videos a::before{content:"";width:0;height:0;border-left:8px solid var(--acc);border-top:5px solid transparent;border-bottom:5px solid transparent}
.ej .fila,.ej label.chk{grid-column:2}

.fila{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
input[type=number],input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus{border-color:var(--acc)}
.corto{width:96px!important;flex:none}
label.chk{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;font-size:14.5px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--card2);display:grid;place-content:center;margin:0}
input[type=checkbox]::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--acc-ink);border-bottom:2.5px solid var(--acc-ink);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{opacity:1}
button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:14px;padding:14px 16px;width:100%;background:var(--acc);color:var(--acc-ink);margin-top:14px;cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.98)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.5}
.ok{color:var(--acc);font-size:13px;font-weight:600;margin-top:10px;display:flex;align-items:center;gap:6px}
.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.compra{border-top:1px solid var(--line);padding:14px 0}.pl-in>.compra:first-child,.conecta+.compra{border-top:0;padding-top:8px}
.area-h{font:700 13px/1 Manrope,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 4px 0}
.conecta{margin-top:6px}
details.listo>summary{opacity:.6}
button.repuse{margin-top:10px;padding:10px 14px;font-size:14px;background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.av{font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);padding:2px 8px;border-radius:99px;white-space:nowrap}
.compra.ya{opacity:.55}
.compra>b{font-size:16.5px}
.toma{font-size:14.5px;margin-top:4px}
.cuando{font-size:13.5px;margin-top:3px;padding-left:8px;border-left:2px solid currentColor;opacity:.85}
.ojo{font-size:13px;font-weight:600;color:var(--warn);margin-top:4px}
.compra-a{display:flex;align-items:center;gap:14px;margin-top:10px}.compra-a label.chk{padding:0;flex:none}
a.btn{flex:1;display:block;text-align:center;text-decoration:none;font-weight:700;font-size:15px;border-radius:12px;padding:11px 14px;background:var(--acc);color:var(--acc-ink)}
.tec{margin:6px 0 0;padding:12px 0 0 18px;border-top:1px solid var(--line);color:var(--mut);font-size:13.5px}.tec li{margin:4px 0}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;font-weight:500}
.escala{display:flex;gap:4px;margin-top:6px}
.escala label{flex:1;min-width:0;text-align:center;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 0;font-weight:600;cursor:pointer}
.escala input{position:absolute;opacity:0;pointer-events:none}
.escala label:has(input:checked){border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.barra{height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}

.horas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.horas button{margin:0;padding:14px 0;background:var(--card2);color:var(--ink);border:1px solid var(--line);font-size:16px}
.horas button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.horas button small{display:block;font-size:10.5px;font-weight:600;opacity:.8}

.slot{border-top:1px solid var(--line);padding:14px 0 4px}
.slot:first-of-type{border-top:0}
.slot-h{display:flex;align-items:baseline;gap:10px}
.slot-h .hora{font:700 18px/1 Manrope,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.slot-h .n{font-weight:600;flex:1}
.slot.lista .slot-h .n::after{content:" · lista";color:var(--acc);font-weight:600;font-size:13px}
.op{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0 0;padding:11px 12px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;text-align:left;font-weight:500;font-size:14.5px}
.op .d{flex:1;min-width:0}
.foto-b{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding:15px 16px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:15.5px;cursor:pointer;min-height:48px}
.foto-i{width:20px;height:16px;border:2px solid currentColor;border-radius:5px;position:relative}
.foto-i::after{content:"";position:absolute;width:6px;height:6px;border:2px solid currentColor;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.comidas-l{margin-top:12px}
.comida{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.comida:first-child{border-top:0}
.comida .hora{font:700 14px Manrope,sans-serif;color:var(--acc);width:44px;flex:none;font-variant-numeric:tabular-nums}
.comida .d{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.comida .d small{display:block;font-weight:500;font-size:12.5px;color:var(--mut);margin-top:2px}
.comida .kcal{width:78px!important;flex:none;padding:8px 10px}
.comida .quitar{all:unset;cursor:pointer;flex:none;width:32px;height:32px;display:grid;place-items:center;font-size:20px;color:var(--mut);border-radius:8px}
.op .d small{display:block;color:var(--mut);font-size:12.5px;font-weight:500}
.op .m{flex:none;text-align:right;font:700 18px/1 Manrope,sans-serif;font-variant-numeric:tabular-nums}
.op .m small{display:block;font:500 11px Manrope,sans-serif;color:var(--mut)}
.op.on{background:var(--acc2);border-color:var(--acc)}
.op.on .m{color:var(--acc)}

details.plan{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
details.plan summary{font-weight:700;cursor:pointer;padding:4px 0}
.plan-l{margin:8px 0 0;padding-left:18px;line-height:1.45}
.plan-l li{margin-bottom:6px}
.plan-t div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.plan-t div:first-child{border-top:0}
.plan-t small{color:var(--mut)}
.plan-t div>b{white-space:nowrap;font-variant-numeric:tabular-nums}

.dia{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.dia:first-child{border-top:0}
.punto{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 15px Manrope,sans-serif;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.punto.si{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.dia .d{flex:1;min-width:0}
.dia .r{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mut);white-space:nowrap}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.meta div{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.meta b{display:block;font:700 26px/1.05 Manrope,sans-serif;font-variant-numeric:tabular-nums}
.meta span{font-size:11.5px;color:var(--mut)}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav .tabs{display:flex;width:100%;max-width:620px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--mut);margin:0;padding:8px 0 6px;border-radius:12px;font-size:11.5px;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--acc);color:var(--acc-ink)}
.cargando{color:var(--mut);padding:28px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.foco{font-size:15px;line-height:1.45;margin:4px 0 6px}.foco span{color:var(--mut)}
.tls{position:relative}
.tl{display:grid;grid-template-columns:50px 18px 1fr 34px;align-items:start;gap:0 8px;padding:8px 0;position:relative}
.tl-h{font:700 17px/1.1 Manrope,sans-serif;font-variant-numeric:tabular-nums}.tl-h small{display:block;font:500 11px/1.3 sans-serif;color:var(--mut)}
.tl-p{width:14px;height:14px;border-radius:50%;margin-top:3px;background:var(--c);box-shadow:0 0 0 3px var(--card,#fff);z-index:1}
.tl::before{content:"";position:absolute;left:64px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-q b{display:block;font-weight:600;line-height:1.25}.tl-q small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.tl-c{width:26px;height:26px;padding:0;margin:0;border-radius:50%;background:transparent;border:2px solid var(--c);justify-self:end}
.tl.listo .tl-c{background:var(--c)}.tl.listo .tl-c::after{content:"";display:block;width:10px;height:5px;margin:7px auto 0;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg)}
.tl.listo .tl-q,.tl.ya .tl-q,.tl.ya .tl-h{opacity:.5}.tl.listo .tl-q b{text-decoration:line-through}
.tl.ahora{background:var(--acc2);border-radius:12px}.tl.ahora .tl-p{width:16px;height:16px;margin-top:2px}
.t-cuerpo{--c:#e8833a}.t-comida{--c:#c9a227}.t-plata{--c:#3b82f6}.t-gym{--c:var(--acc)}.t-bloque{--c:#7c5cff}.t-pausa{--c:#9aa0a6}.t-dante{--c:#e05a8a}.t-cierre{--c:#64748b}.t-mac{--c:#3b82f6}
.run{border:2px solid var(--acc)}.run-top{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:13px;font-weight:600}
.run-top b{font:700 22px/1 Manrope,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.run .barra{margin:10px 0 14px}.run-n{font-size:28px;line-height:1.1;margin:0}.run-d{font-size:16px;margin-top:8px;line-height:1.4}
.run-seg{font:700 56px/1 Manrope,sans-serif;text-align:center;margin:16px 0 0;font-variant-numeric:tabular-nums}.run-seg.ok{color:var(--acc)}
.run-pie{display:flex;gap:10px}.run-pie .sec{flex:1;background:transparent;color:var(--mut);border:1px solid var(--line);margin-top:10px;padding:10px}
.run-sig{margin-top:12px;text-align:center}
.sos{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.sos input{margin-top:4px}
.sos.hecho span{text-decoration:line-through;opacity:.55}.sos small{display:block;opacity:.7}
details.plan summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.plan summary::-webkit-details-marker{display:none}
details.plan summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.plan[open] summary::after{transform:rotate(-135deg)}
.sos .fu{font-size:11.5px;opacity:.55}
details.card.pl>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer}
details.card.pl>summary::-webkit-details-marker{display:none}
details.card.pl>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.card.pl[open]>summary::after{transform:rotate(-135deg)}
details.card.pl>summary .sub{font-weight:500;font-size:14px}
.pl-in>.card{border:0;box-shadow:none;padding:0;margin:12px 0 0;background:none}

<script>
// Entreno de Ignacio. Vive en GitHub Pages (ygnnvcio/mi-entreno) y solo lleva el diseño, como la app de Dante.
// Rutina, recetas y lo registrado (entrenos, comidas, sueño; un registro por fecha) vienen de la API de Apps Script
// y se guardan en la hoja "Entreno Ignacio · datos" del Drive de ygnnvcio. La llave viaja en el #k= del enlace.
var API = "https://script.google.com/macros/s/AKfycbz0wawnLawMnOxG6IdBdF-b4F2uqky5XJ84fmt1aHVMLjKkW5mbq1uZAf-dshxZt9tK/exec";
var K = leerLlave();
var TZ = "America/New_York";
var DIAS_N = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];   // conceptos en inglés (Ignacio, 2026-10-28)
function nom(d) { return d.en || d.n; }
var D = null, SEL = null;
var E = {}, C = {}, Z = {};   // entrenos, comidas y sueño por fecha
var CP = {};   // compras: lo marcado como comprado, por id de producto
var W = {}, WE = null;   // WHOOP: un documento por día de despertar (lo escribe Whoop.gs cada hora) y el estado de la conexión

function leerLlave() {
  var m = location.hash.match(/k=([^&]+)/), k = m ? decodeURIComponent(m[1]) : "";
  try { if (k) localStorage.setItem("mientreno.k", k); else k = localStorage.getItem("mientreno.k") || ""; } catch (e) { /* sin almacenamiento: vale el enlace */ }
  return k;
}
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hoyISO() { return new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); }
function horaLocal() { return new Intl.DateTimeFormat("en-GB", {timeZone: TZ, hour: "2-digit", minute: "2-digit"}).format(new Date()); }
function dISO(f) { var p = f.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function addDias(f, n) { var d = dISO(f); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow(f) { return dISO(f).getUTCDay(); }
function lunesDe(f) { return addDias(f, -((dow(f) + 6) % 7)); }
function fc(f) { return +f.slice(8) + "/" + f.slice(5, 7); }
function diaDe(f) { var w = dow(f); return D.rutina.dias.filter(function (d) { return d.dow === w; })[0]; }
function corto(d) { return d.tipo === "libre" ? "Rest" : nom(d).split(" ")[0].replace("Recovery", "Recov.").replace("Athletics", "Athl."); }
function esFuerza(d, x) { return d.tipo === "gym" && (x.peso === true || (x.peso !== false && !/ s\b|min| m\b/.test(x.sr))); }
function hecho(f) { var e = E[f]; return !!(e && e.items && e.items.some(function (x) { return x.hecho; })); }
function semanaN(f) { var l = lunesDe(f), n = 0; for (var i = 0; i < 7; i++) if (hecho(addDias(l, i))) n++; return n; }
function protDe(f) { var c = C[f]; return c && c.items ? c.items.reduce(function (t, x) { return t + (x.prot || 0); }, 0) : 0; }

// La vez pasada que hizo ese ejercicio con peso: para subir de a poco.
function anterior(ej, antesDe) {
  var fs = Object.keys(E).filter(function (f) { return f < antesDe; }).sort().reverse();
  for (var i = 0; i < fs.length; i++) {
    var it = (E[fs[i]].items || []).filter(function (x) { return x.ejercicio === ej && (x.peso || x.reps); })[0];
    if (it) return {f: fs[i], peso: it.peso, reps: it.reps};
  }
  return null;
}


// ---------------------------------------------------------------- Tu día
var P = {};   // plan del día por fecha: {sosi: [{t, para, hecho}], hechos: {"06:15": true}, manana: [...]}
function minutos(h) { var p = h.split(":"); return +p[0] * 60 + +p[1]; }
function enMin(m) { return m < 60 ? m + " min" : Math.floor(m / 60) + "h" + (m % 60 ? ("0" + m % 60).slice(-2) : ""); }
// Cada cosa una sola vez (Ignacio, 2026-10-16: "no debe haber doble mención"). Despertar vive en Activa tu cuerpo,
// las comidas en Mis platos fijos y el gym en Entreno; esta tarjeta lleva solo las anclas sin tarjeta propia, más la
// MacBook como una sola ancla (de 10:15 a 20:30, comidas en medio) en vez de los bloques de trabajo uno por uno.
// Agenda del día (2026-11-05, Ignacio: "debe estar sincronizado con la rutina de la noche que me ayuda a hacer el cierre"):
// si el Cierre o el chat dejaron plan/<fecha>.agenda en la hoja, manda ese día; si no, el orden por defecto de agenda.json.
function bloquesDe(f) { var a = (P[f || hoyISO()] || {}).agenda; return a && a.length ? a : ((D.agenda || {}).bloques || []); }
function macDe() {
  var bs = bloquesDe().filter(function (b) { return b.t === "bloque"; });
  return bs.length ? {h: bs[0].h, f: bs[bs.length - 1].f} : {h: "10:15", f: "20:30"};
}
function conTarjeta(b) { return !!b.card || b.t === "comida" || b.t === "gym"; }
function anclas() {
  var ESENCIAL = D.agenda.app_tipos || ["cuerpo", "gym", "comida", "dante", "cierre"], m = macDe(), out = [], puesta = false;
  var mac = {h: m.h, f: m.f, n: "MacBook: los negocios primero", t: "mac", nota: "Con pausas para comer. Cómo repartes ese tiempo es tuyo"};
  bloquesDe().forEach(function (b) {
    if (ESENCIAL.indexOf(b.t) < 0 || /^dormir/i.test(b.n)) return;   // dormir va arriba, en la semana
    if (conTarjeta(b) && b.card !== "noche" && minutos(b.h) >= minutos(m.h)) return;   // la mañana va entera, en orden (Ignacio, 2026-11-05); después de la MacBook, comidas y gym solo en su tarjeta
    if (!puesta && minutos(b.h) >= minutos(m.h)) { out.push(mac); puesta = true; }
    out.push(b);
  });
  if (!puesta) out.push(mac);
  return out;
}
function filaAg(b, p, ahora) {
  var ini = minutos(b.h), fin = minutos(b.f), n = b.n, nota = b.nota || "", boton = true, dur = enMin(fin - ini);
  if (/perro/i.test(n)) { n = "Sacar al perro"; nota = "Todos los días" + (nota ? ". " + nota : ""); }
  if (/^dormir/i.test(n)) {
    var meta = D.dormir || b.h, falta = minutos(meta) - ahora;
    n = "Dormir"; b = {h: meta, f: b.f, t: b.t}; boton = false; dur = "";
    nota = falta > 0 ? "Faltan " + Math.floor(falta / 60) + " h " + (falta % 60) + " min" : "Ya es hora: a la cama";
  }
  if (b.t === "mac") { boton = false; dur = "a " + b.f; }
  if (b.t === "gym") { var dg = diaDe(hoyISO()); n = dg.tipo === "libre" ? "Descanso" : "Entreno: " + nom(dg); }
  var hecho = !!(p.hechos || {})[b.h];
  var est = hecho ? " listo" : ahora >= fin ? " ya" : ahora >= ini ? " ahora" : "";
  return '<div class="tl t-' + b.t + est + '"><div class="tl-h">' + b.h + (dur ? '<small>' + dur + '</small>' : "") + '</div><i class="tl-p"></i>' +
    '<div class="tl-q"><b>' + esc(n) + '</b>' + (nota ? '<small>' + esc(nota) + '</small>' : "") + '</div>' +
    (boton ? '<button class="tl-c" data-blk="' + b.h + '" aria-pressed="' + hecho + '" aria-label="Marcar ' + esc(n) + ' como hecho"></button>' : "<span></span>") + '</div>';
}
function agendaHtml(hoy) {
  if (!D.agenda) return "";
  var p = P[hoy] || {}, ahora = minutos(horaLocal());
  return '<div class="card" id="card-agenda"><div class="sub">' + (((P[hoy] || {}).agenda || []).length ? 'Plan del Cierre de anoche · se cambia en el chat' : 'Orden por defecto · el Cierre de la noche lo ajusta') + '</div><h2>Your day</h2><div class="tls">' +
    anclas().map(function (b) { return filaAg(b, p, ahora); }).join("") + '</div></div>';
}
function sosiHtml(hoy) {
  var p = P[hoy] || {}, xs = p.sosi || [];
  var cuerpo = xs.length ? xs.map(function (x, i) {
    return '<label class="sos' + (x.hecho ? " hecho" : "") + '"><input type="checkbox" data-sosi="' + i + '"' + (x.hecho ? " checked" : "") + '><span>' + esc(x.t) + (x.para ? '<small>' + esc(x.para) + '</small>' : "") + '</span></label>';
  }).join("") : '<div class="sub">Todavía no hay sí o sí para hoy. El Cierre de anoche los deja aquí (máximo 3).</div>';
  return '<div class="card" id="card-sosi"><div class="sub">Sí o sí de hoy · van antes que todo</div><h2>' + (xs.length ? xs.filter(function (x) { return x.hecho; }).length + " de " + xs.length + " hechos" : "Sin lista") + '</h2>' + cuerpo + '</div>';
}
// Qué toca ahora y qué sigue (comportamiento visto en Structured). Va en la cabecera, no en una tarjeta,
// para que el día se lea de un vistazo sin repetir nada abajo.
function ahoraSigue(hoy) {
  if (!D.agenda) return "Gym " + D.rutina.hora;
  var d = diaDe(hoy), ahora = minutos(horaLocal()), m = macDe(), act = null, sig = null;
  var xs = [{h: m.h, f: m.f, n: "MacBook", mac: true}];
  bloquesDe(hoy).forEach(function (b) {
    var n = b.n;
    if (b.card === "manana" || b.card === "noche") n = D.agenda[b.card] ? D.agenda[b.card].titulo : n;
    else if (b.t === "comida") n = ((D.comidas || [])[b.slot] || {}).n || n;
    else if (b.t === "gym") { if (d.tipo === "libre") return; n = "Gym"; }
    else if (/perro/i.test(n)) n = "Sacar al perro";
    else if (["cuerpo", "dante", "cierre"].indexOf(b.t) < 0) return;
    xs.push({h: b.h, f: b.f, n: n.split(",")[0].split(":")[0]});
  });
  xs.sort(function (a, b) { return minutos(a.h) - minutos(b.h); });
  xs.forEach(function (x) {
    var ini = minutos(x.h), fin = minutos(x.f);
    if (ahora >= ini && ahora < fin && (!act || act.mac)) act = x;
    if (!sig && ini > ahora) sig = x;
  });
  var t = act ? "Ahora: " + act.n : "Tiempo libre";
  return t + (sig ? " · sigue " + sig.n + " " + sig.h : "");
}

// Rutina de mañana como rutina de Hevy: tarjeta con resumen y un botón Empezar; al empezar, un paso a la vez
// a pantalla de tarjeta, con reloj grande, "Hecho" que avanza solo y el paso siguiente a la vista.
var RUN = null, tInt = null;   // {k, i, fin}: rutina (manana o noche), paso actual y fin del tope
// Dos rutinas con el mismo formato: la de la mañana y el recovery de la noche (Ignacio, 2026-11-05).
var RUT = {
  manana: {en: "Morning routine", hora: function () { return "despertar " + (D.despertar || "06:00"); }, abre: function () { return "Despertar " + (D.despertar || "06:00") + " · así parte el día"; },
    fin: "Cuerpo activado", tope: "Se acabó el tiempo. A desayunar", temprano: function (n, N) { return n < N && minutos(horaLocal()) < minutos("12:00"); }},
  noche: {en: "Night recovery", hora: function () { return "aparatos fuera " + (D.agenda.noche.desde || "21:30"); }, abre: function () { return "Aparatos fuera " + (D.agenda.noche.desde || "21:30") + " · así cierra el día"; },
    fin: "Listo. A la cama", tope: "Se acabó el tiempo. A la cama", temprano: function (n, N) { var a = minutos(horaLocal()); return n < N && a >= minutos("21:00") && a < minutos("23:59"); }}
};
function rutinaDoc(hoy, k) { var doc = P[hoy] || (P[hoy] = {fecha: hoy}); doc[k] = doc[k] || []; return doc; }
function mananaHtml(hoy) { return rutinaHtml(hoy, "manana"); }
function rutinaHtml(hoy, k) {
  if (!D.agenda || !D.agenda[k]) return "";
  var M = D.agenda[k], R = RUT[k], m = (P[hoy] || {})[k] || [], n = m.filter(Boolean).length, N = M.pasos.length, id = "card-" + k;
  if (RUN && RUN.k === k) {
    var x = M.pasos[RUN.i], prox = M.pasos[RUN.i + 1];
    return '<div class="card run" id="' + id + '"><div class="run-top"><span>Paso ' + (RUN.i + 1) + ' de ' + N + '</span><b id="t-reloj">--:--</b></div>' +
      '<div class="barra"><i style="width:' + Math.round(100 * RUN.i / N) + '%"></i></div>' +
      '<h2 class="run-n">' + esc(x.n) + '</h2><div class="run-d">' + esc(x.d) + '</div>' +
      (x.seg ? '<div class="run-seg" id="t-paso">' + Math.floor(x.seg / 60) + ':' + ("0" + x.seg % 60).slice(-2) + '</div>' : "") +
      '<button id="b-hecho">' + (prox ? "Hecho, siguiente" : "Hecho, terminar") + '</button>' +
      '<div class="run-pie"><button class="sec" id="b-saltar">Saltar</button><button class="sec" id="b-parar">Parar</button></div>' +
      (prox ? '<div class="sub run-sig">Sigue: ' + esc(prox.n) + '</div>' : "") + '</div>';
  }
  // Así parte (o cierra) el día (Ignacio, 2026-10-16): abierta en su hora hasta que la haces; fuera de ella, plegada.
  var temprano = !!activas(hoy)[k] || R.temprano(n, N);
  if (k in ABIERTO) temprano = false;
  var resumen = '<div class="sub">' + esc(M.pasos.map(function (x) { return x.n; }).join(" · ")) + '</div>';
  var cuerpo = resumen + '<button data-empezar="' + k + '">' + (n === N ? "Hecha. Repetir" : n ? "Seguir (" + n + " de " + N + ")" : "Empezar " + M.min + " min") + '</button>' +
    '<details class="plan"><summary>Detalle y fuentes</summary><ol class="plan-l">' + M.pasos.map(function (x, i) {
      return '<li>' + (m[i] ? "<s>" : "") + '<b>' + esc(x.n) + '</b>: ' + esc(x.d) + (m[i] ? "</s>" : "") + '<br><small class="sub">' + esc(x.fuente) + '</small></li>';
    }).join("") + '</ol><div class="sub">' + esc(M.regla) + '. ' + esc(M.alarma) + '.</div></details>';
  var tit = esc(M.en || R.en) + ' <span class="sub">· ' + n + ' de ' + N + '</span>';
  if (temprano) return '<div class="card" id="' + id + '"><div class="sub">' + esc(R.abre()) + '</div><h2>' + tit + '</h2>' + cuerpo + '</div>';
  return '<div class="card" id="' + id + '"><details class="plan" data-card="' + k + '" style="margin-top:0;border-top:0;padding-top:0"' + (ABIERTO[k] ? " open" : "") + '><summary><span>' + esc(M.en || R.en) + ' <span class="sub">· ' + esc(R.hora()) + ' · ' + n + ' de ' + N + '</span></span></summary>' + cuerpo + '</details></div>';
}
function reloj(ms) { var r = Math.max(0, Math.round(ms / 1000)); return Math.floor(r / 60) + ":" + ("0" + r % 60).slice(-2); }
function tic() {
  if (!RUN) return;
  var el = $("#t-reloj"), ahora = Date.now();
  if (el) el.textContent = reloj(RUN.fin - ahora);
  var ps = $("#t-paso");
  if (ps && RUN.finPaso) { ps.textContent = reloj(RUN.finPaso - ahora); if (ahora >= RUN.finPaso && !RUN.avisado) { RUN.avisado = true; ps.classList.add("ok"); if (navigator.vibrate) navigator.vibrate(300); } }
  if (ahora >= RUN.fin) { terminarRun(RUT[RUN.k].tope); }
}
function pasoActual() { var x = D.agenda[RUN.k].pasos[RUN.i]; RUN.finPaso = x.seg ? Date.now() + x.seg * 1000 : 0; RUN.avisado = false; }
function terminarRun(msg) { var k = RUN ? RUN.k : "manana"; clearInterval(tInt); tInt = null; RUN = null; if (navigator.vibrate) navigator.vibrate([300, 150, 300]); aviso(msg, true); pintarRutina(k); }
function pintarRutina(k) { var el = $("#card-" + k); if (el) { el.outerHTML = rutinaHtml(hoyISO(), k); enlazar(SEL || hoyISO()); tic(); } }
function avanzar(marcar) {
  var hoy = hoyISO(), k = RUN.k, doc = rutinaDoc(hoy, k), N = D.agenda[k].pasos.length;
  if (marcar) { doc[k][RUN.i] = true; doc.actualizado = new Date().toISOString(); guardar("plan/" + hoy, doc, "Hecho"); }
  var i = RUN.i + 1; while (i < N && doc[k][i]) i++;
  if (i >= N) { terminarRun(doc[k].filter(Boolean).length === N ? RUT[k].fin : "Terminado"); return; }
  RUN.i = i; pasoActual(); pintarRutina(k);
}

// ---------------------------------------------------------------- Hoy
function cabecera(hoy) {
  var d = diaDe(hoy);
  $("#fecha").textContent = DIAS_N[dow(hoy)] + " " + fc(hoy);
  $("#titulo").textContent = d.tipo === "libre" ? "Rest day" : corto(d) === "Legs" ? "Leg day" : nom(d).split(" + ")[0];
  var pill = $("#pill");
  pill.hidden = false;
  pill.textContent = ahoraSigue(hoy);
  $("#dormir").innerHTML = dormirLinea();   // dormir arriba, junto al ahora (Ignacio, 2026-10-28)
  var n = semanaN(hoy);
  $("#pct").textContent = n;
  $("#arco").style.strokeDashoffset = 201 - 201 * Math.min(1, n / 6);
  var pr = protDe(hoy), comidas = C[hoy] && C[hoy].items ? C[hoy].items.length : 0, sz = Z[hoy], wz = puntuado(hoy);
  $("#kpis").innerHTML = '<div><b>' + pr + '</b><span>g protein</span></div><div><b>' + kcalDe(hoy) + '</b><span>kcal · ' + comidas + (comidas === 1 ? ' meal' : ' meals') + '</span></div><div><b>' + (wz ? (Math.round(wz.sueno.dormido_h * 10) / 10) : sz ? sz.horas : "—") + '</b><span>h sleep</span></div>';
}
// Orden de Hoy (Roast Room 2026-10-15, opción C): arriba lo obligatorio y la agenda; se abre sola la tarjeta
// que pide el bloque actual de la agenda (campo card en agenda.json), el resto va plegado y cada tarjeta cuenta sus aperturas.
function activas(hoy) {
  var a = {}, ahora = minutos(horaLocal());
  bloquesDe(hoy).forEach(function (b) { if (b.card && b.card !== "entreno" && ahora >= minutos(b.h) && ahora < minutos(b.f)) a[b.card] = true; });
  if (!Z[hoy] && !puntuado(hoy) && ahora < minutos("12:00")) a.sueno = true;   // con WHOOP ya no se pide a mano
  if (D.fijo) a.comidas = true;   // platos fijos: apartado siempre a la vista (Ignacio, 2026-10-16)
  // El entreno no se abre solo (Ignacio, 2026-10-16): la rutina se mira cuando él la abre; tocar un día no la despliega.
  return a;
}
var ABIERTO = {};   // lo que abriste o cerraste a mano en esta visita manda sobre la agenda
function pliegue(k, titulo, html, abierta) {
  if (k in ABIERTO) abierta = ABIERTO[k];
  return '<details class="card pl" data-card="' + k + '"' + (abierta ? " open" : "") + '><summary><span>' + titulo + '</span></summary><div class="pl-in">' + html + '</div></details>';
}
function render() {
  var hoy = hoyISO(), sel = SEL || hoy, A = activas(hoy), d = diaDe(sel);
  cabecera(hoy);
  var sz = Z[hoy], hechos = ((E[sel] || {}).items || []).filter(function (x) { return x.hecho; }).length;
  // Orden fijo, sin saltos según la hora, y cada cosa una sola vez (Ignacio, 2026-10-16): la semana arriba;
  // Activa tu cuerpo con el despertar; Tu día con las anclas sin tarjeta propia (perro, MacBook, Dante, cierre,
  // dormir); el sí o sí si el Cierre dejó algo; platos fijos abiertos; entreno, sueño y guía plegados.
  var sos = ((P[hoy] || {}).sosi || []).length ? sosiHtml(hoy) : "";
  var ent = [];
  if (sel !== hoy) ent.push(DIAS_N[dow(sel)].toLowerCase() + " " + fc(sel));
  if (d.tipo === "libre") ent.push("día libre"); else { if (sel === hoy) ent.push(D.rutina.hora); ent.push(hechos + " de " + d.ej.length); }
  // Orden del 2026-10-28 (Ignacio: "el orden no está correcto"; skill impeccable): arriba lo innegociable (dormir en la
  // cabecera, el sí o sí), después tus metas y luego el día en orden de reloj: mañana, semana con su entreno, comidas, agenda.

function platoN(r, comida) {

}

// Achica la foto a 1280 px en JPEG antes de subirla, como la app de Dante: sube rápido con datos móviles.
function achicar(file, listo) {
  var img = new Image();
  img.onload = function () {
    var k = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    listo(cv.toDataURL("image/jpeg", 0.72).split(",")[1]);
  };
  img.onerror = function () { aviso("No pude leer la foto. Intenta con otra"); };
  img.src = URL.createObjectURL(file);
}

 "pasos": ["Igual que el almuerzo, con palta en vez de aceite."]}, "fijo-cena-atun": {"n": "Cena fija con atún (2 a 3 veces por semana)", "min": 5, "kcal": 599, "prot": 31, "ing": [["Atún claro en agua, escurrido", 100, "1 lata escurrida"], ["Arroz blanco cocido", 250, "1½ taza cocido"], ["Palta", 100, "½ palta"], ["Brócoli", 100, "1 taza"]], "pasos": ["Atún claro, no albacore: 2 a 3 latas por semana.", "Arroz, palta y brócoli como siempre."]}, "batido-subir": {"n": "Batido para subir", "min": 5, "kcal": 818, "prot": 41, "ing": [["Avena", 60, "¾ taza"], ["Leche entera cruda", 300, "1¼ taza"], ["Plátano", 120, "1 plátano"], ["Crema de maní sin sal", 32, "2 cucharadas"], ["Yogur de proteína", 150, "1 pote"]], "pasos": ["Todo a la licuadora, 40 segundos.", "Si queda espeso, un chorro más de leche."]}}}/*FIN-FIJO*/;

<script type="module">
// Cuerpo 3D de la pestaña WHOOP (2026-11-01; sólido desde el 2026-11-05): figura que gira y
// respira sobre anillos, con luces de contorno del color de la banda de recuperación y el piso latiendo al pulso. three.js r180
// de cdnjs (mapa de importación en <head>); el cargador de glTF no está en cdnjs y viene de jsdelivr con la misma versión.
// El cuerpo (2026-11-05, Ignacio: "debe tener forma de cuerpo atlético de peleador") es cuerpo.glb, armado con la malla base y
// los targets de MakeHuman, que son CC0 (LICENSE.ASSETS.md de makehumancommunity/makehuman): hombre joven, músculo alto, peso
// bajo (60 kg magro), proporciones ideales, espalda en V, dorsales, pectoral, brazos y piernas marcados, 1,71 m (su altura hoy
// con compensaciones de postura; ~1,74 m al corregirlas). Lo arma scripts/entreno_cuerpo.py; no es un escaneo real de su cuerpo,
// que no va en el repo público mi-entreno.
// Se descarga solo al abrir la pestaña y deja de dibujar cuando la pestaña o la app no están a la vista.
const V = "0.180.0";
const CUERPO = new URL("cuerpo.glb", location.href).href;
const ALTURA = 1.71;
const quieto = matchMedia("(prefers-reduced-motion: reduce)");
const pedido = {cont: null, color: "#b5f23d", bpm: 60, resp: 15};
let S = null, carga = null;

// Postura de escaneo: de pie, brazos sueltos a los costados y rodillas apenas flexionadas. Cada paso gira un hueso del
// esqueleto de MakeHuman sobre un eje del mundo (el cuerpo mira a +z), en orden de padre a hijo. Una guardia de pelea queda
// pendiente: sin huesos de dedos las manos no cierran el puño y se ven abiertas.
const POSE = [
  ["spine01", [0, 1, 0], -4], ["head", [1, 0, 0], 3],
  ["upperarm01L", [0, 0, 1], -43], ["upperarm01L", [1, 0, 0], -4], ["lowerarm01L", [1, 0, 0], 30],
  ["upperarm01R", [0, 0, 1], 43], ["upperarm01R", [1, 0, 0], -4], ["lowerarm01R", [1, 0, 0], 30],
  ["upperleg01L", [1, 0, 0], -3], ["lowerleg01L", [1, 0, 0], 5], ["upperleg01R", [1, 0, 0], -2], ["lowerleg01R", [1, 0, 0], 4]
];
const nomHueso = n => n.replace(/[^a-z0-9]/gi, "");

async function crear() {
  const T = await import("three");
  const {GLTFLoader} = await import(`https://cdn.jsdelivr.net/npm/three@${V}/examples/jsm/loaders/GLTFLoader.js`);
  const r = new T.WebGLRenderer({antialias: true, alpha: true, powerPreference: "low-power"});
  r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
  r.domElement.style.touchAction = "pan-y";
  const escena = new T.Scene(), cam = new T.PerspectiveCamera(30, 1, 0.1, 40);
  cam.position.set(0, 1.55, 4.6); cam.lookAt(0, 0.95, 0);
  const color = new T.Color(pedido.color);
  // Cuerpo sólido (Ignacio, 2026-11-05: "sólido y realista"): piel mate, luz principal cálida arriba a la izquierda, relleno
  // tenue y dos luces de contorno por detrás con el color de la banda de recuperación, como una foto de estudio.
  const piel = new T.MeshStandardMaterial({color: 0x9c7d68, roughness: 0.48, metalness: 0.02});
  escena.add(new T.HemisphereLight(0xdfe6ff, 0x1a1410, 0.25));
  const luz = new T.DirectionalLight(0xfff1e0, 3.2); luz.position.set(-3.2, 4.2, 1.6); escena.add(luz);
  const relleno = new T.DirectionalLight(0xbfd4ff, 0.18); relleno.position.set(2.5, 1.2, 2.0); escena.add(relleno);
  const contornos = [[-2.6, 2.2, -2.4], [2.6, 1.6, -2.2]].map(([x, y, z]) => { const l = new T.DirectionalLight(color, 3.0); l.position.set(x, y, z); escena.add(l); return l; });

  const gltf = await new GLTFLoader().loadAsync(CUERPO);
  const modelo = gltf.scene, fig = new T.Group(), huesos = {};
  modelo.traverse(o => {
    if (o.isMesh) { o.frustumCulled = false; o.material = piel; }
    if (o.isBone) huesos[nomHueso(o.name)] = o;
  });
  const gr = Math.PI / 180, qp = new T.Quaternion();
  for (const [n, eje, a] of POSE) {
    const h = huesos[nomHueso(n)]; if (!h) continue;
    h.parent.updateMatrixWorld(true); h.parent.getWorldQuaternion(qp);
    h.quaternion.premultiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(...eje).applyQuaternion(qp.invert()), a * gr));
  }
  const base = {};
  for (const n of ["lowerleg01L", "lowerleg01R"]) { const h = huesos[nomHueso(n)]; if (h) base[n] = h.rotation.x; }
  // Mide el cuerpo ya posado y lo deja con los pies en el piso.
  modelo.updateMatrixWorld(true);
  const caja = new T.Box3().setFromObject(modelo, true);
  modelo.position.set(-(caja.min.x + caja.max.x) / 2, -caja.min.y, -(caja.min.z + caja.max.z) / 2);
  fig.add(modelo); fig.rotation.y = 0.5; escena.add(fig);
  // Las rodillas ceden un poco al ritmo de la respiración, como un peleador listo para moverse.
  const balanceo = s => { for (const n in base) huesos[nomHueso(n)].rotation.x = base[n] + s * 1.5 * gr; };

  // Anillos del piso (doble, late al pulso en reposo) y uno que sube y baja por el cuerpo, como un escáner.
  const lineas = [];
  const anillo = (y, rad, op) => {
    const pts = [];
    for (let i = 0; i <= 128; i++) { const a = i / 128 * Math.PI * 2; pts.push(new T.Vector3(Math.cos(a) * rad, y, Math.sin(a) * rad)); }
    const l = new T.Line(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({color, transparent: true, opacity: op, blending: T.AdditiveBlending, depthWrite: false}));
    escena.add(l); lineas.push(l); return l;
  };
  const piso = anillo(0.005, 0.5, 0.9); anillo(0.005, 0.41, 0.3);
  const barrido = anillo(0, 0.34, 0);
  const tela = document.createElement("canvas"); tela.width = tela.height = 128;
  const g = tela.getContext("2d"), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(255,255,255,.6)"); grad.addColorStop(0.55, "rgba(255,255,255,.14)"); grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const brillo = new T.Mesh(new T.PlaneGeometry(1.3, 1.3), new T.MeshBasicMaterial({map: new T.CanvasTexture(tela), color, transparent: true, blending: T.AdditiveBlending, depthWrite: false}));
  brillo.rotation.x = -Math.PI / 2; escena.add(brillo);

  // Arrastre horizontal para girarlo; el vertical sigue siendo scroll de la página.
  let arr = null, t = 0, prev = 0, vivo = false;
  const cv = r.domElement;
  cv.addEventListener("pointerdown", e => { arr = {x: e.clientX, y: e.clientY, a: fig.rotation.y, eje: null}; });
  cv.addEventListener("pointermove", e => {
    if (!arr) return;
    const dx = e.clientX - arr.x, dy = e.clientY - arr.y;
    if (!arr.eje && Math.hypot(dx, dy) > 6) arr.eje = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (arr.eje === "x") { fig.rotation.y = arr.a + dx * 0.012; pedirCuadro(); }
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => cv.addEventListener(ev, () => { arr = null; }));

  const tam = {w: 0, h: 0};
  const cuadro = ahora => {
    const c = pedido.cont;
    if (!c || !c.isConnected || c.closest("[hidden]") || document.hidden) { vivo = false; return; }
    const dt = prev ? Math.min(0.05, (ahora - prev) / 1000) : 0, mueve = !quieto.matches;
    prev = ahora;
    if (mueve) { t += dt; if (!arr) fig.rotation.y += dt * 0.3; }
    const fase = (t % 4.5) / 4.5, y = 0.05 + fase * 1.75;
    barrido.position.y = y; barrido.material.opacity = mueve ? 0.45 * Math.sin(Math.PI * fase) : 0;
    // Respira a su frecuencia respiratoria de anoche (WHOOP, respiraciones por minuto): el tórax se abre y se cierra, y la
    // guardia se balancea con el mismo ritmo.
    const aire = mueve ? Math.sin(t * Math.PI * 2 * pedido.resp / 60) : 0;
    fig.scale.set(1 + 0.01 * aire, 1, 1 + 0.014 * aire); balanceo(aire);
    const latido = Math.exp(-((t * pedido.bpm / 60) % 1) * 6);
    piso.material.opacity = 0.5 + 0.5 * latido; brillo.material.opacity = 0.3 + 0.45 * latido; brillo.scale.setScalar(1 + 0.07 * latido);
    const w = c.clientWidth, h = c.clientHeight;
    if (w && h && (w !== tam.w || h !== tam.h)) { tam.w = w; tam.h = h; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
    r.render(escena, cam);
    if (mueve || arr) requestAnimationFrame(cuadro); else vivo = false;
  };
  const pedirCuadro = () => { if (vivo) return; vivo = true; prev = 0; requestAnimationFrame(cuadro); };
  S = {r, color, lineas, brillo, pedirCuadro, tam, contornos};
}

function aplicar() {
  S.color.set(pedido.color);
  S.lineas.forEach(l => l.material.color.set(pedido.color));
  S.brillo.material.color.set(pedido.color);
  S.contornos.forEach(l => l.color.set(pedido.color));
  if (S.r.domElement.parentNode !== pedido.cont) { pedido.cont.appendChild(S.r.domElement); S.tam.w = S.tam.h = 0; }
  const aviso = document.getElementById("wh-estado3d");
  if (aviso) aviso.hidden = true;
  S.pedirCuadro();
}
window.Cuerpo3D = {
  montar(cont, op) {
    Object.assign(pedido, op, {cont});
    if (S) { aplicar(); return; }
    if (!carga) carga = crear().catch(e => { carga = null; throw e; });
    carga.then(aplicar, e => {
      const aviso = document.getElementById("wh-estado3d");
      if (aviso) { aviso.classList.add("fallo"); aviso.textContent = "El cuerpo 3D no cargó (" + ((e && e.message) || e) + "). Los números siguen al día."; }
    });
  }
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && S && pedido.cont) S.pedirCuadro(); });
if (window.montarCuerpo) window.montarCuerpo();
</script>
